<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Resistance: Avalon</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --good: #2563eb; --evil: #dc2626; --gold: #f59e0b; --text: #f8fafc; --muted: #94a3b8; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 440px; }
    h1 { color: var(--gold); text-align: center; font-size: 22px; margin-bottom: 16px; letter-spacing: 1px; }
    .card { background: var(--card); border-radius: 12px; padding: 18px; border: 1px solid #334155; margin-bottom: 14px; }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: 700; font-size: 15px; margin-top: 10px; cursor: pointer; color: #fff; }
    .btn-gold { background: var(--gold); color: #000; }
    .btn-blue { background: var(--good); }
    .btn-red { background: var(--evil); }
    .btn-opt { background: transparent; border: 2px solid #475569; color: var(--text); }
    .btn-opt.active { border-color: var(--gold); background: rgba(245, 158, 11, 0.2); }
    input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; margin: 8px 0; }
    .board { display: flex; gap: 6px; margin-bottom: 14px; }
    .slot { flex: 1; background: var(--card); border: 2px solid #334155; border-radius: 8px; text-align: center; padding: 8px 2px; }
    .slot.cur { border-color: var(--gold); }
    .slot.ok { border-color: var(--good); background: rgba(37,99,235,0.2); }
    .slot.fail { border-color: var(--evil); background: rgba(220,38,38,0.2); }
  </style>
</head>
<body>
<div class="container">
  <h1>RESISTANCE: AVALON</h1>
  <div id="boardBox" style="display:none;"></div>
  <div id="ui"></div>
</div>

<script>
const CFG = { 5:[3,2,[2,3,2,3,3],false], 6:[4,2,[2,3,4,3,4],false], 7:[4,3,[2,3,3,4,4],true], 8:[5,3,[3,4,4,5,5],true], 9:[6,3,[3,4,4,5,5],true], 10:[6,4,[3,4,4,5,5],true] };
let G = { players:[], roles:{}, quest:0, res:[], streak:0, lIdx:0, sel:[], qVotes:[] };

function renderSetup() {
  document.getElementById('boardBox').style.display = 'none';
  document.getElementById('ui').innerHTML = `
    <div class="card">
      <h3 style="margin-bottom:8px;">Oyuncu Listesi</h3>
      <p style="font-size:13px; color:var(--muted)">Virgülle ayırarak 5-10 isim yazın:</p>
      <input id="namesInp" placeholder="Ahmet, Mehmet, Ayşe, Fatma, Ali">
      <button class="btn btn-gold" onclick="initGame()">Oyunu Kur ve Başlat</button>
    </div>`;
}

function initGame() {
  const arr = document.getElementById('namesInp').value.split(',').map(x=>x.trim()).filter(Boolean);
  if(arr.length < 5 || arr.length > 10) return alert("5 ile 10 oyuncu girilmelidir!");
  G.players = arr;
  const c = CFG[arr.length];
  let deck = ["Merlin","Percival","Assassin","Morgana"];
  if(c[1] > 2) for(let i=0; i<c[1]-2; i++) deck.push("Minion of Mordred");
  for(let i=0; i<c[0]-2; i++) deck.push("Loyal Servant");
  deck.sort(()=>Math.random()-0.5);
  G.players.forEach((p,i)=>G.roles[p]=deck[i]);
  G.quest=0; G.res=[]; G.streak=0; G.lIdx = Math.floor(Math.random()*arr.length);
  stepNight(0);
}

function stepNight(idx) {
  if(idx >= G.players.length) return renderTurn();
  const p = G.players[idx];
  const r = G.roles[p];
  const isEvil = ["Assassin","Morgana","Minion of Mordred"].includes(r);
  const evilList = G.players.filter(x=>["Assassin","Morgana","Minion of Mordred"].includes(G.roles[x]));
  let extra = "";
  if(r==="Merlin") extra = "Kötüler: " + evilList.join(', ');
  else if(r==="Percival") {
    let cand = G.players.filter(x=>["Merlin","Morgana"].includes(G.roles[x])).sort(()=>Math.random()-0.5);
    extra = "Merlin/Morgana: " + cand.join(', ');
  } else if(isEvil) extra = "Kötü Ortaklar: " + evilList.filter(x=>x!==p).join(', ');

  document.getElementById('ui').innerHTML = `
    <div class="card" style="text-align:center;">
      <h3>Telefonu ${p} kişisine verin</h3>
      <button class="btn btn-blue" onclick="this.style.display='none'; document.getElementById('sc').style.display='block';">Bilgiyi Aç</button>
      <div id="sc" style="display:none; margin-top:12px;">
        <h2 style="color:${isEvil?'var(--evil)':'var(--good)'}; margin:8px 0;">${r}</h2>
        <p style="font-size:14px; margin-bottom:8px;">${isEvil?'KÖTÜLER (Mordred)':'İYİLER (Arthur)'}</p>
        ${extra ? `<div style="background:#0f172a; padding:8px; border-radius:6px; font-size:13px; margin:8px 0;">${extra}</div>` : ''}
        <button class="btn btn-gold" onclick="stepNight(${idx+1})">Ezberledim, Gizle</button>
      </div>
    </div>`;
}

function updateBoard() {
  const b = document.getElementById('boardBox');
  b.style.display = 'flex';
  b.className = 'board';
  const sizes = CFG[G.players.length][2];
  b.innerHTML = sizes.map((s,i)=>{
    let cls = "slot";
    let txt = s;
    if(i === G.quest) cls += " cur";
    if(G.res[i]===true) { cls += " ok"; txt="✓"; }
    if(G.res[i]===false) { cls += " fail"; txt="✕"; }
    return `<div class="${cls}"><div style="font-size:10px; color:var(--muted)">G${i+1}</div><div style="font-weight:bold">${txt}</div></div>`;
  }).join('');
}

function renderTurn() {
  updateBoard();
  const req = CFG[G.players.length][2][G.quest];
  const leader = G.players[G.lIdx];
  G.sel = [];
  document.getElementById('ui').innerHTML = `
    <div class="card">
      <div style="font-size:13px; color:var(--muted); margin-bottom:6px;">Red Sayacı: ${G.streak}/5</div>
      <h3 style="margin-bottom:8px;">Lider: ${leader}</h3>
      <p style="font-size:13px; margin-bottom:12px;">Görev için <strong>${req}</strong> kişi seç:</p>
      ${G.players.map(p=>`<button class="btn btn-opt" id="b_${p}" onclick="toggleP('${p}',${req})">${p}</button>`).join('')}
      <button class="btn btn-gold" style="margin-top:14px;" onclick="submitTeam(${req})">Takımı Oyla</button>
    </div>`;
}

function toggleP(p, req) {
  const btn = document.getElementById('b_'+p);
  const i = G.sel.indexOf(p);
  if(i > -1) { G.sel.splice(i,1); btn.classList.remove('active'); }
  else if(G.sel.length < req) { G.sel.push(p); btn.classList.add('active'); }
}

function submitTeam(req) {
  if(G.sel.length !== req) return alert(req + " kişi seçmelisiniz!");
  document.getElementById('ui').innerHTML = `
    <div class="card" style="text-align:center;">
      <h3>Takım Oylaması</h3>
      <p style="margin:12px 0;">Seçilen: <strong>${G.sel.join(', ')}</strong></p>
      <button class="btn btn-blue" onclick="vote(true)">KABUL ET</button>
      <button class="btn btn-red" onclick="vote(false)">REDDET</button>
    </div>`;
}

function vote(appr) {
  if(!appr) {
    G.streak++;
    G.lIdx = (G.lIdx+1)%G.players.length;
    if(G.streak >= 5) return gameOver(false, "5 defa üst üste takım reddedildi!");
    return renderTurn();
  }
  G.streak = 0;
  G.qVotes = [];
  G.lIdx = (G.lIdx+1)%G.players.length;
  stepQuest(0);
}

function stepQuest(idx) {
  if(idx >= G.sel.length) return finishQuest();
  const m = G.sel[idx];
  const r = G.roles[m];
  const isEvil = ["Assassin","Morgana","Minion of Mordred"].includes(r);
  document.getElementById('ui').innerHTML = `
    <div class="card" style="text-align:center;">
      <h3>Telefonu ${m} kişisine verin</h3>
      <button class="btn btn-blue" onclick="this.style.display='none'; document.getElementById('qc').style.display='block';">Oy Ver</button>
      <div id="qc" style="display:none; margin-top:12px;">
        <button class="btn btn-blue" onclick="castQ(true, ${idx})">BAŞARILI (Success)</button>
        ${isEvil ? `<button class="btn btn-red" onclick="castQ(false, ${idx})">SABOTAJA UĞRAT (Fail)</button>` : ''}
      </div>
    </div>`;
}

function castQ(val, idx) {
  G.qVotes.push(val);
  stepQuest(idx+1);
}

function finishQuest() {
  G.qVotes.sort(()=>Math.random()-0.5);
  const fails = G.qVotes.filter(x=>!x).length;
  const needFails = (CFG[G.players.length][3] && G.quest===3) ? 2 : 1;
  const ok = fails < needFails;
  G.res.push(ok);
  G.quest++;

  document.getElementById('ui').innerHTML = `
    <div class="card" style="text-align:center;">
      <h2 style="color:${ok?'var(--good)':'var(--evil)'};">${ok?'GÖREV BAŞARILI':'GÖREV SABOTE EDİLDİ'}</h2>
      <p style="margin:12px 0;">Açılan Fail Kartı: <strong>${fails}</strong></p>
      <button class="btn btn-gold" onclick="checkGame()">Devam Et</button>
    </div>`;
}

function checkGame() {
  const goods = G.res.filter(x=>x).length;
  const evils = G.res.filter(x=>!x).length;
  if(evils >= 3) return gameOver(false, "Kötüler 3 görev sabote etti.");
  if(goods >= 3) return renderAssassin();
  renderTurn();
}

function renderAssassin() {
  const goodP = G.players.filter(x=>!["Assassin","Morgana","Minion of Mordred"].includes(G.roles[x]));
  document.getElementById('ui').innerHTML = `
    <div class="card" style="text-align:center;">
      <h3 style="color:var(--evil);">Suikastçi Evresi!</h3>
      <p style="font-size:13px; margin:8px 0;">İyiler 3 görev tamamladı. Suikastçi Merlin'i tahmin etmeli:</p>
      ${goodP.map(p=>`<button class="btn btn-red" onclick="kill('${p}')">${p}</button>`).join('')}
    </div>`;
}

function kill(t) {
  if(G.roles[t] === "Merlin") gameOver(false, `Suikastçi Merlin'i (${t}) vurdu!`);
  else gameOver(true, `Suikastçi yanıldı! Hedef: ${t}, Merlin: ${G.players.find(x=>G.roles[x]==="Merlin")}`);
}

function gameOver(goodWin, reason) {
  document.getElementById('ui').innerHTML = `
    <div class="card" style="text-align:center;">
      <h2 style="color:${goodWin?'var(--good)':'var(--evil)'}; margin-bottom:8px;">${goodWin?'İYİLER KAZANDI!':'KÖTÜLER KAZANDI!'}</h2>
      <p style="font-size:14px; margin-bottom:12px;">${reason}</p>
      <div style="text-align:left; background:#0f172a; padding:10px; border-radius:6px; font-size:13px;">
        <strong>Roller:</strong><br>
        ${G.players.map(p=>`${p}: <strong>${G.roles[p]}</strong>`).join('<br>')}
      </div>
      <button class="btn btn-gold" style="margin-top:14px;" onclick="renderSetup()">Yeni Oyun</button>
    </div>`;
}

renderSetup();
</script>
</body>
</html>
