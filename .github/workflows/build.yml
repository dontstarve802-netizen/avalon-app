name: Android APK Derle

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Cek
        uses: actions/checkout@v4

      - name: Java Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Android SDK Kur
        uses: android-actions/setup-android@v3

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Web Dizinini Olustur
        run: |
          mkdir -p dist
          cp index.html dist/

      - name: Capacitor Hazirla
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init Avalon com.oyun.avalon --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Gradle APK Derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Avalon-Oyunu-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
